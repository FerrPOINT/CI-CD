services:
  engine-tools:
    image: ${CICD_QA_DOCKER_TOOLS_IMAGE:?Pinned Docker CLI and Compose image required}
    labels: {sdlc.task: forge-task-delivery, sdlc.purpose: disposable-docker-cli-tooling}
    networks: [qa]
    entrypoint: ["/bin/sh", "-ec"]
    command: ["mkdir -p /tools/cli-plugins; cp /usr/local/bin/docker /tools/docker; cp /usr/local/libexec/docker/cli-plugins/docker-compose /tools/docker-compose; cp /usr/local/libexec/docker/cli-plugins/docker-compose /tools/cli-plugins/docker-compose; cp /usr/local/libexec/docker/cli-plugins/docker-buildx /tools/cli-plugins/docker-buildx; chmod 0555 /tools/docker /tools/docker-compose /tools/cli-plugins/docker-compose /tools/cli-plugins/docker-buildx; while :; do sleep 3600; done"]
    healthcheck:
      test: [CMD-SHELL, "test -x /tools/docker && test -x /tools/docker-compose && test -x /tools/cli-plugins/docker-compose && test -x /tools/cli-plugins/docker-buildx"]
      interval: 1s
      timeout: 2s
      retries: 10
      start_period: 1s
    volumes: [engine-tools:/tools]
  qa:
    depends_on:
      engine-tools: {condition: service_healthy}
    volumes:
      - engine-tools:/qa-tools:ro
volumes:
  engine-tools: {}
