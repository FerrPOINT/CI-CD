# K6.2 → M1: Prometheus scrape config for the Base observability profile.
# Scope: ALL Base services — Forge CI/CD + fleet-control + task-tracker +
# wiki + java-agent. Aliases resolve per-network: `backend` in `tt` is
# tt-backend, in `wiki` wiki-backend, in `fc` fc-backend.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: forge-cicd
    metrics_path: /metrics
    static_configs:
      - targets: ["cicd-backend:22801"]
        labels:
          service: forge-cicd

  - job_name: fleet-control
    metrics_path: /metrics
    static_configs:
      - targets: ["fc-backend:23801"]
        labels:
          service: fleet-control

  - job_name: task-tracker
    metrics_path: /metrics
    static_configs:
      - targets: ["tt-backend:3456"]
        labels:
          service: task-tracker

  - job_name: wiki
    metrics_path: /metrics
    static_configs:
      - targets: ["wiki-backend:3456"]
        labels:
          service: wiki

  - job_name: java-agent
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["agent:9969"]
        labels:
          service: java-agent

rule_files:
  - /etc/prometheus/rules/forge-alerts.yaml
  - /etc/prometheus/rules/base-alerts.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
