# K6.2: Prometheus scrape config for the Base observability profile.
# Scope: Forge CI/CD backend + platform postgres exporters (opt-in profile).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: forge-cicd
    metrics_path: /metrics
    static_configs:
      - targets: ["cicd-backend:22801"]
        labels:
          service: forge-cicd

rule_files:
  - /etc/prometheus/rules/forge-alerts.yaml
