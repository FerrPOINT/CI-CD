# K7.2: Alertmanager with a generic external monitoring hook.
# FORGE_ALERT_WEBHOOK_URL (compose env) receives every firing alert as JSON.
# Optional Telegram delivery: FORGE_ALERT_BOT_TOKEN + FORGE_ALERT_CHAT_ID
# (substituted by compose sed; empty chat_id disables the telegram config).
route:
  receiver: external-hook
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: external-hook
    webhook_configs:
      - url: __WEBHOOK_URL__
        send_resolved: true
    telegram_configs:
      - bot_token: __TG_BOT_TOKEN__
        chat_id: __TG_CHAT_ID__
        send_resolved: true
        parse_mode: ""
        message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
