version: 2
updates:
  # NOTE: cargo (/backend) and npm (/frontend) ecosystems are intentionally NOT
  # configured. Backend path-depends on the sibling services-base checkout
  # (pdlc-shared, pdlc-auth-core) and frontend on @pdlc/ui
  # (file:../../services-base/base-modules/ui); GitHub Dependabot clones only this
  # repository, so manifest resolution always fails (dependency_file_not_resolvable /
  # ENOENT services-base). Cargo/npm dependency updates are done manually with
  # the full backend+frontend gate.
  #
  # GitHub Actions workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
