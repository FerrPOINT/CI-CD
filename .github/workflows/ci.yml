name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: CI-CD/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forge_owner
          POSTGRES_PASSWORD: forge_test_owner
          POSTGRES_DB: forge_test_cicd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CICD_TEST_DATABASE_URL: postgres://forge_owner:forge_test_owner@localhost:5432/forge_test_cicd
    steps:
    - uses: actions/checkout@v7
      with:
        path: CI-CD
    - uses: actions/checkout@v7
      with:
        repository: FerrPOINT/services-base
        path: services-base
        ref: main
        token: ${{ secrets.SERVICES_BASE_TOKEN }}
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: "1.88"
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: backend
    - name: fmt
      run: cargo fmt --all -- --check
    - name: clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: unit tests
      run: cargo test --workspace
    - name: integration tests (real PostgreSQL)
      run: cargo test --features integration --test integration_db -- --test-threads=1
    - name: CLI integration smoke (real HTTP API and PostgreSQL)
      run: cargo test -p cicd-cli --features integration --test cli_real_api -- --test-threads=1
    - name: release build
      run: cargo build --release --workspace
    - name: openapi drift gate
      run: |
        cargo run --bin openapi-dump -- /tmp/openapi.yaml
        diff -u ../openapi/openapi.yaml /tmp/openapi.yaml

  # install + test + lint + build via the shared fleet gate.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CI-CD/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          path: CI-CD
      - name: Check out services-base sibling (@sdlc/ui file dep)
        uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: CI-CD/frontend/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
        env:
          CI: "true"
      - run: pnpm openapi:check
      - run: pnpm test -- --run
      - run: pnpm lint
      - run: pnpm build
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        path: CI-CD
    - uses: actions/checkout@v7
      with:
        repository: FerrPOINT/services-base
        path: services-base
        ref: main
        token: ${{ secrets.SERVICES_BASE_TOKEN }}
    - name: Compose config
      run: docker compose config -q
    - name: Build and start stack
      run: docker compose up --build -d
    - name: Backend health
      run: |
        for i in {1..60}; do
          curl -fsS http://127.0.0.1:22801/api/v1/health && exit 0
          sleep 2
        done
        docker compose ps
        exit 1
    - name: Backend readiness
      run: |
        for i in {1..60}; do
          curl -fsS http://127.0.0.1:22801/api/v1/readiness && exit 0
          sleep 2
        done
        docker compose ps
        exit 1
    - name: Frontend nginx
      run: |
        for i in {1..60}; do
          curl -fsS http://127.0.0.1:22802/ >/tmp/forge-frontend-index.html && exit 0
          sleep 2
        done
        docker compose ps
        exit 1
    - name: Compose logs
      if: failure()
      run: docker compose logs --no-color
    - name: Compose cleanup
      if: always()
      run: docker compose down -v --remove-orphans

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        path: CI-CD
    - uses: actions/checkout@v4
      with:
        repository: FerrPOINT/services-base
        path: services-base
        ref: main
        token: ${{ secrets.SERVICES_BASE_TOKEN }}
    - uses: pnpm/setup@v2
      with:
        version: 11
        runtime: node@22
        cache: true
        cache-dependency-path: CI-CD/frontend/pnpm-lock.yaml
        install: false
    - name: Install frontend dependencies
      working-directory: CI-CD/frontend
      run: pnpm install --frozen-lockfile
    - name: Install Playwright browser
      working-directory: CI-CD/frontend
      run: pnpm exec playwright install --with-deps chromium
    - name: Prepare synthetic secrets key
      run: echo "CICD_SECRETS_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
    - name: Compose config
      working-directory: CI-CD
      run: docker compose config -q
    - name: Build and start stack
      working-directory: CI-CD
      run: docker compose up --build -d
    - name: Backend readiness
      run: |
        for i in {1..60}; do
          curl -fsS http://127.0.0.1:22801/api/v1/readiness && exit 0
          sleep 2
        done
        docker compose ps
        exit 1
    - name: Seed evidence data
      working-directory: CI-CD/frontend
      run: pnpm seed:evidence
    - name: Playwright E2E/a11y/performance
      working-directory: CI-CD/frontend
      env:
        E2E_BASE_URL: http://127.0.0.1:22802
        E2E_API_URL: http://127.0.0.1:22801/api/v1
      run: pnpm e2e
    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: |
          frontend/playwright-report
          frontend/test-results
        if-no-files-found: ignore
        retention-days: 14
    - name: Compose logs
      if: failure()
      working-directory: CI-CD
      run: docker compose logs --no-color
    - name: Compose cleanup
      if: always()
      working-directory: CI-CD
      run: docker compose down -v --remove-orphans

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CI-CD
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        path: CI-CD
    - uses: actions/checkout@v4
      with:
        repository: FerrPOINT/services-base
        path: services-base
        ref: main
        token: ${{ secrets.SERVICES_BASE_TOKEN }}
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: "1.88"