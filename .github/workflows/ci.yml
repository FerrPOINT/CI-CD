name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: CI-CD/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forge_owner
          POSTGRES_PASSWORD: forge_test_owner
          POSTGRES_DB: forge_test_cicd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CICD_TEST_DATABASE_URL: postgres://forge_owner:forge_test_owner@localhost:5432/forge_test_cicd
    steps:
    - uses: actions/checkout@v4
      with:
        path: CI-CD
    - uses: actions/checkout@v4
      with:
        repository: FerrPOINT/services-base
        path: services-base
        ref: main
        token: ${{ secrets.SERVICES_BASE_TOKEN }}
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: "1.88"
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: backend
    - name: fmt
      run: cargo fmt --all -- --check
    - name: clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: unit tests
      run: cargo test --workspace
    - name: integration tests (real PostgreSQL)
      run: cargo test --features integration --test integration_db -- --test-threads=1
    - name: CLI integration smoke (real HTTP API and PostgreSQL)
      run: cargo test -p cicd-cli --features integration --test cli_real_api -- --test-threads=1
    - name: release build
      run: cargo build --release --workspace
    - name: openapi drift gate
      run: |
        cargo run --bin openapi-dump -- /tmp/openapi.yaml
        diff -u ../openapi/openapi.yaml /tmp/openapi.yaml

  # install + test + lint + build via the shared fleet gate.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CI-CD/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          path: CI-CD
      - name: Check out services-base sibling (@sdlc/ui file dep)
        uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: CI-CD/frontend/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
        env:
          CI: "true"
      - run: pnpm openapi:check
      - run: pnpm test -- --run
      - run: pnpm lint
      - run: pnpm build
  compose-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CI-CD
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        path: CI-CD
    - uses: actions/checkout@v4
      with:
        repository: FerrPOINT/services-base
        path: services-base
        ref: main
        token: ${{ secr