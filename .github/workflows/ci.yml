name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: CI-CD
    steps:
      - uses: actions/checkout@v4
        with:
          path: CI-CD
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: documentation regression tests
        run: python3 -m unittest scripts.tests.test_verify_docs scripts.tests.test_base_stand_backup scripts.tests.test_ci_contract_checks
      - name: documentation checks
        run: python3 scripts/verify_docs.py --all
      - name: script checks
        run: |
          python3 -m py_compile scripts/verify_docs.py scripts/generate_sbom.py scripts/scan_secrets.py scripts/forge_backup.py
          bash -n scripts/backup.sh scripts/backup-stand.sh scripts/restore.sh scripts/verify-backup.sh scripts/scan_container_images.sh

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: CI-CD/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forge_owner
          POSTGRES_PASSWORD: forge_test_owner
          POSTGRES_DB: forge_test_cicd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CICD_TEST_DATABASE_URL: postgres://forge_owner:forge_test_owner@localhost:5432/forge_test_cicd
    steps:
      - uses: actions/checkout@v4
        with:
          path: CI-CD
      - name: Read pinned Base revision
        id: base
        working-directory: CI-CD
        run: echo "sha=$(cat .base-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          ref: ${{ steps.base.outputs.sha }}
      - name: Verify pinned Base checkout
        working-directory: CI-CD
        run: python3 ../services-base/scripts/verify_base_revision.py --revision .base-revision --base ../services-base
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: unit tests
        run: cargo test --locked --workspace
      - name: integration tests (real PostgreSQL)
        run: cargo test --locked --features integration --test integration_db -- --test-threads=1
      - name: Create isolated CLI test database
        env:
          PGPASSWORD: forge_test_owner
        run: createdb -h 127.0.0.1 -p 5432 -U forge_owner forge_test_cli
      - name: CLI tests (real PostgreSQL)
        env:
          CICD_TEST_DATABASE_URL: postgres://forge_owner:forge_test_owner@localhost:5432/forge_test_cli
        run: cargo test --locked -p cicd-cli --features integration --test cli_real_api -- --test-threads=1
      - name: CLI integration clippy
        run: cargo clippy --locked -p cicd-cli --all-targets --features integration -- -D warnings
      - name: openapi drift gate
        run: |
          cargo run --locked --bin openapi-dump -- /tmp/openapi.yaml
          diff -u ../openapi/openapi.yaml /tmp/openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: CI-CD/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          path: CI-CD
      - name: Read pinned Base revision
        id: base
        working-directory: CI-CD
        run: echo "sha=$(cat .base-revision)" >> "$GITHUB_OUTPUT"
      - name: Check out services-base sibling (@sdlc/ui file dep)
        uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
          ref: ${{ steps.base.outputs.sha }}
      - name: Verify pinned Base checkout
        working-directory: CI-CD
        run: python3 ../services-base/scripts/verify_base_revision.py --revision .base-revision --base ../services-base
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v6
        with:
          node-version: "22.20.0"
          cache: pnpm
          cache-dependency-path: CI-CD/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        env:
          CI: "true"
      - run: pnpm openapi:check
      - run: pnpm test -- --run
      - run: pnpm lint
      - name: OpenAPI compatibility against target branch
        run: |
          git fetch origin main --depth=1
          pnpm openapi:compat
      - name: Generated contract and lockfile stay unchanged
        run: git diff --exit-code -- pnpm-lock.yaml src/api/generated.ts src/api/schema.d.ts
      - run: pnpm build
      - name: Packed Base consumer
        run: python ../../services-base/scripts/check_ui_consumer.py
      - name: Effective themes in the built consumer
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/theme-preview.log 2>&1 &
          pnpm theme:check http://127.0.0.1:4173

  minimum-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: CI-CD
      - name: Read pinned Base revision
        id: base
        working-directory: CI-CD
        run: echo "sha=$(cat .base-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: ${{ steps.base.outputs.sha }}
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - name: Verify pinned Base checkout
        working-directory: CI-CD
        run: python3 ../services-base/scripts/verify_base_revision.py --revision .base-revision --base ../services-base
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CI-CD/backend
      - name: Check declared minimum independently of release builds
        working-directory: CI-CD/backend
        run: cargo check --locked --workspace --all-targets
