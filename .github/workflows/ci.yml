name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forge_owner
          POSTGRES_PASSWORD: forge_test_owner
          POSTGRES_DB: forge_test_cicd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CICD_TEST_DATABASE_URL: postgres://forge_owner:forge_test_owner@localhost:5432/forge_test_cicd
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: "1.86"
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: backend
    - name: fmt
      run: cargo fmt --all -- --check
    - name: clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: unit tests
      run: cargo test --workspace
    - name: integration tests (real PostgreSQL)
      run: cargo test --features integration --test integration_db -- --test-threads=1
    - name: release build
      run: cargo build --release --workspace
    - name: openapi drift gate
      run: |
        cargo run --bin openapi-dump -- /tmp/openapi.yaml
        diff -u ../openapi/openapi.yaml /tmp/openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/setup@v2
      with:
        version: 11
        runtime: node@22
        cache: true
        cache-dependency-path: frontend/pnpm-lock.yaml
        install: false
    - run: pnpm install --frozen-lockfile
    - name: generated client up to date
      run: |
        pnpm openapi:generate
        git diff --exit-code -- src/api/schema.d.ts || (echo "schema.d.ts is stale; run pnpm openapi:generate" && exit 1)
    - run: pnpm lint
    - run: pnpm test
    - run: pnpm build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Compose config
      run: docker compose config -q
    - name: Build and start stack
      run: docker compose up --build -d
    - name: Backend health
      run: |
        for i in {1..60}; do
          curl -fsS http://127.0.0.1:22801/api/v1/health && exit 0
          sleep 2
        done
        docker compose ps
        exit 1
    - name: Backend readiness
      run: |
        for i in {1..60}; do
          curl -fsS http://127.0.0.1:22801/api/v1/readiness && exit 0
          sleep 2
        done
        docker compose ps
        exit 1
    - name: Frontend nginx
      run: |
        for i in {1..60}; do
          curl -fsS http://127.0.0.1:22802/ >/tmp/forge-frontend-index.html && exit 0
          sleep 2
        done
        docker compose ps
        exit 1
    - name: Compose logs
      if: failure()
      run: docker compose logs --no-color
    - name: Compose cleanup
      if: always()
      run: docker compose down -v --remove-orphans

  e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/setup@v2
      with:
        version: 11
        runtime: node@22
        cache: true
        cache-dependency-path: frontend/pnpm-lock.yaml
        install: false
    - name: Install frontend dependencies
      working-directory: frontend
      run: pnpm install --frozen-lockfile
    - name: Install Playwright browser
      working-directory: frontend
      run: pnpm exec playwright install --with-deps chromium
    - name: Prepare synthetic secrets key
      run: echo "CICD_SECRETS_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
    - name: Compose config
      run: docker compose config -q
    - name: Build and start stack
      run: docker compose up --build -d
    - name: Backend readiness
      run: |
        for i in {1..60}; do
          curl -fsS http://127.0.0.1:22801/api/v1/readiness && exit 0
          sleep 2
        done
        docker compose ps
        exit 1
    - name: Seed evidence data
      working-directory: frontend
      run: pnpm seed:evidence
    - name: Playwright E2E
      working-directory: frontend
      env:
        E2E_BASE_URL: http://127.0.0.1:22802
        E2E_API_URL: http://127.0.0.1:22801/api/v1
      run: pnpm e2e
    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: |
          frontend/playwright-report
          frontend/test-results
        if-no-files-found: ignore
        retention-days: 14
    - name: Compose logs
      if: failure()
      run: docker compose logs --no-color
    - name: Compose cleanup
      if: always()
      run: docker compose down -v --remove-orphans

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: "1.86"
    - name: Rust dependency audit
      working-directory: backend
      run: |
        set -euo pipefail
        cargo install cargo-audit --locked --version 0.22.1
        if cargo tree -i sqlx-mysql --edges features --target all --prefix none 2>&1 | grep -q '^sqlx-mysql v'; then
          echo "sqlx-mysql is enabled in the build graph; remove RUSTSEC-2023-0071 ignore before shipping"
          exit 1
        fi
        if cargo tree -i rsa --target all --prefix none 2>&1 | grep -q '^rsa v'; then
          echo "rsa is enabled in the build graph; remove RUSTSEC-2023-0071 ignore before shipping"
          exit 1
        fi
        cargo audit --ignore RUSTSEC-2023-0071
    - uses: pnpm/setup@v2
      with:
        version: 11
        runtime: node@22
        cache: true
        cache-dependency-path: frontend/pnpm-lock.yaml
        install: false
    - name: Node dependency audit
      working-directory: frontend
      run: |
        pnpm install --frozen-lockfile
        pnpm audit --audit-level high
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Secret scan
      run: python3 scripts/scan_secrets.py
    - name: SBOM drift gate
      run: python3 scripts/generate_sbom.py --check
    - name: Build production images for scan
      run: |
        docker build -t forge-cicd-backend:ci backend
        docker build -t forge-cicd-frontend:ci frontend
    - name: Container image scan
      run: bash scripts/scan_container_images.sh forge-cicd-backend:ci forge-cicd-frontend:ci

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: script checks
      run: |
        python3 -m py_compile scripts/verify_docs.py scripts/generate_sbom.py scripts/scan_secrets.py scripts/forge_backup.py
        python3 scripts/forge_backup.py self-test
        python3 scripts/forge_backup.py backup --dry-run --skip-git-fsck --backup-dir /tmp/forge-backup-smoke
        python3 scripts/forge_backup.py restore --dry-run --confirm-restore --skip-git-fsck /tmp/forge-backup-smoke
        bash -n scripts/backup.sh scripts/restore.sh scripts/verify-backup.sh scripts/scan_container_images.sh
    - name: documentation checks
      run: python3 scripts/verify_docs.py --all
