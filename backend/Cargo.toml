[workspace]
members = [".", "domain", "cli", "migration"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
authors = ["FerrPOINT <ferrpoint@users.noreply.github.com>"]
license-file = "LICENSE"
repository = "https://github.com/FerrPOINT/CI-CD"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "derive", "migrate"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
jsonwebtoken = { version = "9", default-features = false }
subtle = { version = "2", default-features = false }
uuid = { version = "1", features = ["serde", "v4"] }

[package]
name = "cicd-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
autobins = false

[lib]
name = "cicd"
path = "src/lib.rs"

[[bin]]
name = "cicd-server"
path = "src/main.rs"

[[bin]]
name = "openapi-dump"
path = "src/bin/openapi-dump.rs"

[[bin]]
name = "forge-runner"
path = "src/bin/forge-runner.rs"


[features]
integration = []

[dependencies]
reqwest.workspace = true
tokio-stream = "0.1"
utoipa = { workspace = true }
argon2 = { workspace = true }
rand_core = { workspace = true }
jsonwebtoken = { workspace = true }
subtle = { workspace = true }
aes-gcm = "0.10"
anyhow.workspace = true
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono.workspace = true
cicd-domain = { path = "domain" }
clap.workspace = true
flate2 = "1"
git2 = { version = "0.20", default-features = false }
serde.workspace = true
serde_json.workspace = true
# time pinned: 0.3.42+ requires rustc 1.88; fleet toolchain is 1.86
time = "=0.3.41"
# Fleet auth core: sibling services-base checkout (umbrella compose + CI).
sdlc-auth-core = { path = "../../../services-base/crates/sdlc-auth-core" }
serde_yaml = { package = "yaml_serde", version = "0.10" }
sha2 = "0.10"
hmac = "0.12"
sqlx = { workspace = true }
thiserror.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
