server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # REST API and Git Smart HTTP share the backend service.
  location = /index.html {
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store" always;
  }

  location /api/ { proxy_pass http://backend:22801; }
  location /git/ { proxy_pass http://backend:22801; }
  location /assets/ {
    try_files $uri =404;
  }

  location / { try_files $uri $uri/ /index.html; }
}
