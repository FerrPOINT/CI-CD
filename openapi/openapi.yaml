            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiToken'
    post:
      tags:
      - tokens
      operationId: create_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateToken'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedToken'
        '400':
          description: ''
  /api/v1/api-tokens/{token_id}:
    delete:
      tags:
      - tokens
      operationId: delete_token
      parameters:
      - name: token_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
        '404':
          description: ''
