openapi: 3.1.0
info:
  title: Forge CI/CD API
  description: Self-hosted CI/CD control plane. Array responses, error envelope and in-process rate limits follow docs/contracts/API_CONTRACT.md and docs/API.md current compatibility mode.
  license:
    name: FerrPOINT Proprietary Source-Available Evaluation License v1.0
    url: https://github.com/FerrPOINT/CI-CD/blob/main/LICENSE
  version: 0.1.0
paths:
  /api/v1/api-tokens:
    get:
      tags:
      - tokens
      operationId: list_tokens
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiToken'
    post:
      tags:
      - tokens
      operationId: create_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateToken'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedToken'
        '400':
          description: ''
  /api/v1/api-tokens/{token_id}:
    delete:
      tags:
      - tokens
      operationId: delete_token
      parameters:
      - name: token_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
        '404':
          description: ''
  /api/v1/artifacts/{artifact_id}/download:
    get:
      tags:
      - artifacts
      operationId: download_artifact
      parameters:
      - name: artifact_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Artifact download
        '404':
          description: ''
  /api/v1/audit-log:
    get:
      tags:
      - audit
      operationId: list_audit_log
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      operationId: auth_login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: ''
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      operationId: auth_logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      operationId: auth_refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: ''
  /api/v1/environments/{environment_id}:
    delete:
      tags:
      - environments
      operationId: delete_environment
      parameters:
      - name: environment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
        '404':
          description: ''
    patch:
      tags:
      - environments
      operationId: update_environment
      parameters:
      - name: environment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnvironment'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '404':
          description: ''
  /api/v1/environments/{environment_id}/deployments:
    get:
      tags:
      - environments
      operationId: list_deployments
      parameters:
      - name: environment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deployment'
    post:
      tags:
      - environments
      operationId: create_deployment
      parameters:
      - name: environment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeployment'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '400':
          description: ''
  /api/v1/health:
    get:
      tags:
      - health
      operationId: health
      responses:
        '200':
          description: Liveness
  /api/v1/internal/git-push:
    post:
      tags:
      - git
      summary: |-
        Internal endpoint called by the generated `post-receive` hook.
        Finds a project whose repository_url points at this repo and triggers a pipeline.
      operationId: internal_git_push
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitPushEvent'
        required: true
      responses:
        '200':
          description: Pipeline trigger decision
        '400':
          description: ''
        '401':
          description: ''
  /api/v1/jobs/{job_id}/artifacts:
    get:
      tags:
      - artifacts
      operationId: list_artifacts
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Artifact'
    post:
      tags:
      - artifacts
      operationId: upload_artifact
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Artifact-Name
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: array
              items:
                type: integer
                format: int32
                minimum: 0
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '400':
          description: ''
  /api/v1/jobs/{job_id}/attempts:
    get:
      tags:
      - jobs
      operationId: list_job_attempts
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobAttempt'
        '404':
          description: ''
  /api/v1/jobs/{job_id}/attempts/{attempt_id}/logs:
    get:
      tags:
      - jobs
      operationId: list_attempt_logs
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attempt_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobLog'
        '404':
          description: ''
  /api/v1/jobs/{job_id}/attempts/{attempt_id}/logs/page:
    get:
      tags:
      - jobs
      summary: Bounded page of logs for a concrete attempt. Preserves the legacy array endpoint.
      operationId: list_attempt_logs_page
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attempt_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: after
        in: query
        description: Return log rows with sequence greater than this value.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
      - name: limit
        in: query
        description: Page size. Default and maximum are 200 rows.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: q
        in: query
        description: Optional case-insensitive substring filter for message text.
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobLogPage'
        '400':
          description: ''
        '404':
          description: ''
  /api/v1/jobs/{job_id}/logs:
    get:
      tags:
      - jobs
      operationId: list_logs
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobLog'
    post:
      tags:
      - jobs
      operationId: append_log
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendLog'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobLog'
  /api/v1/jobs/{job_id}/logs/page:
    get:
      tags:
      - jobs
      summary: Bounded page of logs for the active or latest attempt.
      operationId: list_logs_page
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: after
        in: query
        description: Return log rows with sequence greater than this value.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int32
      - name: limit
        in: query
        description: Page size. Default and maximum are 200 rows.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: q
        in: query
        description: Optional case-insensitive substring filter for message text.
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobLogPage'
        '400':
          description: ''
        '404':
          description: ''
  /api/v1/jobs/{job_id}/logs/stream:
    get:
      tags:
      - jobs
      summary: 'SSE live log stream: emits existing lines, then polls for new ones.'
      operationId: job_log_stream
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: after
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: text/event-stream of job log lines
  /api/v1/jobs/{job_id}/retry:
    post:
      tags:
      - jobs
      operationId: retry_job
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: ''
  /api/v1/jobs/{job_id}/start:
    post:
      tags:
      - jobs
      summary: 'Starts a manual (`when: manual`) job — approval gate (GitLab parity).'
      operationId: start_manual_job
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualJobStartResult'
        '404':
          description: ''
        '409':
          description: job is not a waiting manual job
  /api/v1/jobs/{job_id}/status:
    post:
      tags:
      - jobs
      operationId: change_job_status
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStatus'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: ''
  /api/v1/jobs/{job_id}/test-report:
    get:
      tags:
      - jobs
      operationId: get_test_report
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestReport'
    post:
      tags:
      - jobs
      summary: 'Minimal JUnit XML parser: sums testsuite/testcase counts and failures.'
      operationId: upload_test_report
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          text/plain:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestReport'
  /api/v1/openapi.json:
    get:
      tags:
      - health
      operationId: serve_openapi_json
      responses:
        '200':
          description: OpenAPI JSON document
  /api/v1/outbox-deliveries/{delivery_id}:
    get:
      tags:
      - outbox
      operationId: get_outbox_delivery
      parameters:
      - name: delivery_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxDeliveryDetail'
        '404':
          description: ''
  /api/v1/outbox-deliveries/{delivery_id}/requeue:
    post:
      tags:
      - outbox
      operationId: requeue_outbox_delivery
      parameters:
      - name: delivery_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequeuedOutboxDelivery'
        '400':
          description: ''
        '404':
          description: ''
  /api/v1/pipelines/{pipeline_id}:
    get:
      tags:
      - pipelines
      operationId: get_pipeline
      parameters:
      - name: pipeline_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineDetail'
        '404':
          description: ''
  /api/v1/pipelines/{pipeline_id}/badge.svg:
    get:
      tags:
      - pipelines
      operationId: pipeline_badge
      parameters:
      - name: pipeline_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: SVG badge
  /api/v1/pipelines/{pipeline_id}/cancel:
    post:
      tags:
      - pipelines
      operationId: cancel_pipeline
      parameters:
      - name: pipeline_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanceledPipelineResult'
        '404':
          description: ''
        '409':
          description: ''
  /api/v1/pipelines/{pipeline_id}/retry:
    post:
      tags:
      - pipelines
      operationId: retry_pipeline
      parameters:
      - name: pipeline_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetriedPipelineResult'
        '404':
          description: ''
        '409':
          description: ''
  /api/v1/pipelines/{pipeline_id}/variables:
    get:
      tags:
      - pipelines
      operationId: pipeline_variables
      parameters:
      - name: pipeline_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
  /api/v1/projects:
    get:
      tags:
      - projects
      operationId: list_projects
      parameters:
      - name: limit
        in: query
        description: Max items (1..=200, default 50).
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: offset
        in: query
        description: Offset (default 0).
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      tags:
      - projects
      operationId: create_project
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: validation error
  /api/v1/projects/{project_id}:
    get:
      tags:
      - projects
      operationId: get_project
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: ''
    delete:
      tags:
      - projects
      operationId: delete_project
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
        '404':
          description: ''
    patch:
      tags:
      - projects
      operationId: update_project
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProject'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: ''
  /api/v1/projects/{project_id}/environments:
    get:
      tags:
      - environments
      operationId: list_environments
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Environment'
    post:
      tags:
      - environments
      operationId: create_environment
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironment'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '400':
          description: ''
  /api/v1/projects/{project_id}/memberships:
    get:
      tags:
      - memberships
      operationId: list_project_memberships
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMembership'
        '404':
          description: ''
    post:
      tags:
      - memberships
      operationId: upsert_project_membership
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMembershipInput'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMembership'
        '400':
          description: ''
        '404':
          description: ''
  /api/v1/projects/{project_id}/memberships/{user_id}:
    delete:
      tags:
      - memberships
      operationId: delete_project_membership
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
        '404':
          description: ''
        '409':
          description: ''
  /api/v1/projects/{project_id}/notification-events:
    get:
      tags:
      - notifications
      operationId: list_notification_events
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: Maximum number of recent notification events to return.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationEvent'
        '400':
          description: ''
  /api/v1/projects/{project_id}/notifications:
    get:
      tags:
      - notifications
      operationId: list_notifications
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
    put:
      tags:
      - notifications
      operationId: replace_notifications
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/NotificationInput'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '400':
          description: ''
  /api/v1/projects/{project_id}/notifications/stream:
    get:
      tags:
      - notifications
      operationId: notification_stream
      parameters:
      - name: project_id
