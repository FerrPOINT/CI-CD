components:
  schemas:
    ApiToken:
      type: object
      required:
      - id
      - name
      - token_hint
      - scopes
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
          format: uuid
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        name:
          type: string
        project_id:
          type:
          - string
          - 'null'
          format: uuid
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        scopes:
          type: array
          items:
            type: string
        token_hint:
          type: string
        user_id:
          type:
          - string
          - 'null'
          format: uuid
    AppendLog:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    Artifact:
      type: object
      required:
      - id
      - job_id
      - name
      - content_type
      - size_bytes
      - created_at
      properties:
        attempt_id:
          type:
          - string
          - 'null'
          format: uuid
        content_type:
          type: string
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        name:
          type: string
        sha256:
          type:
          - string
          - 'null'
        size_bytes:
          type: integer
          format: int64
    AuditEvent:
      type: object
      required:
      - id
      - action
      - resource_type
      - created_at
      properties:
        action:
          type: string
        actor:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        resource_id:
          type:
          - string
          - 'null'
          format: uuid
        resource_type:
          type: string
    BlobContent:
      type: object
      required:
      - path
      - sha
      - size
      - content
      - binary
      - truncated
      properties:
        binary:
          type: boolean
        content:
          type: string
        path:
          type: string
        sha:
          type: string
        size:
          type: integer
          format: int64
        truncated:
          type: boolean
    CanceledPipelineResult:
      type: object
      required:
      - canceled
      properties:
        canceled:
          type: string
          format: uuid
    ChangeStatus:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/JobStatus'
    CommitInfo:
      type: object
      required:
      - sha
      - short_sha
      - author
      - email
      - message
      - date
      properties:
        author:
          type: string
        date:
          type: string
        email:
          type: string
        message:
          type: string
        sha:
          type: string
        short_sha:
          type: string
    CreateDeployment:
      type: object
      required:
      - git_ref
      properties:
        git_ref:
          type: string
        pipeline_id:
          type:
          - string
          - 'null'
          format: uuid
        status:
          type:
          - string
          - 'null'
    CreateEnvironment:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        url:
          type:
          - string
          - 'null'
    CreateProject:
      type: object
      required:
