        refresh_token:
          type: string
    TriggerPipeline:
      type: object
      properties:
        git_ref:
          type:
          - string
          - 'null'
    UpdateEnvironment:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
    UpdateProject:
      type: object
      properties:
        default_branch:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        repository_url:
          type:
          - string
          - 'null'
    User:
      type: object
      required:
      - id
      - username
      - role
      - enabled
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        enabled:
          type: boolean
        id:
          type: string
          format: uuid
        role:
          type: string
        username:
          type: string
    UserInput:
      type: object
      required:
      - username
      - role
      properties:
        enabled:
          type:
          - boolean
          - 'null'
        password:
          type:
          - string
          - 'null'
          description: Optional argon2id password; enables interactive login (AUTHZ_CONTRACT).
        role:
          type: string
        username:
          type: string
    Webhook:
      type: object
      required:
      - id
      - project_id
      - url
      - events
      - enabled
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        enabled:
          type: boolean
        events:
          type: array
          items:
            type: string
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        url:
          type: string
