      - secrets
      operationId: delete_secret
      parameters:
      - name: secret_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
        '404':
          description: ''
  /api/v1/users:
    get:
      tags:
      - users
      operationId: list_users
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags:
      - users
      operationId: create_user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: ''
  /api/v1/users/{user_id}:
    patch:
      tags:
      - users
      operationId: update_user
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: ''
        '404':
          description: ''
  /api/v1/webhooks/{webhook_id}:
    delete:
      tags:
      - webhooks
      operationId: delete_webhook
      parameters:
      - name: webhook_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
        '404':
          description: ''
  /git/{repo}/git-upload-pack:
    post:
      tags:
      - git
      operationId: git_service_endpoint
      parameters:
      - name: repo
        in: path
        description: Repository name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: array
              items:
                type: integer
                format: int32
                minimum: 0
        required: true
      responses:
        '200':
          description: git-upload-pack or git-receive-pack result payload
        '400':
          description: Unsupported git service
        '401':
          description: ''
        '404':
          description: ''
  /git/{repo}/info/refs:
    get:
      tags:
      - git
      operationId: git_info_refs
      parameters:
      - name: repo
        in: path
        description: Repository name
        required: true
        schema:
          type: string
      - name: service
        in: query
        description: git-upload-pack or git-receive-pack
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Git Smart HTTP ref advertisement
        '400':
          description: Missing or unsupported service
        '401':
          description: ''
        '404':
          description: ''
components:
  schemas:
    ApiToken:
      type: object
      required:
      - id
      - name
      - token_hint
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        name:
          type: string
        token_hint:
          type: string
        user_id:
          type:
          - string
          - 'null'
          format: uuid
    AppendLog:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    Artifact:
      type: object
      required:
      - id
      - job_id
      - name
      - content_type
      - size_bytes
      - created_at
      properties:
        content_type:
          type: string
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        name:
          type: string
        size_bytes:
          type: integer
          format: int64
    AuditEvent:
      type: object
      required:
      - id
      - action
      - resource_type
      - created_at
      properties:
        action:
          type: string
        actor:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        resource_id:
          type:
          - string
          - 'null'
          format: uuid
        resource_type:
          type: string
    ChangeStatus:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/JobStatus'
    CommitInfo:
      type: object
      required:
      - sha
      - short_sha
      - author
      - email
      - message
      - date
      properties:
        author:
          type: string
        date:
          type: string
        email:
          type: string
        message:
          type: string
        sha:
          type: string
        short_sha:
          type: string
    CreateDeployment:
      type: object
      required:
      - git_ref
      properties:
        git_ref:
          type: string
        pipeline_id:
          type:
          - string
          - 'null'
          format: uuid
        status:
          type:
          - string
          - 'null'
    CreateEnvironment:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        url:
          type:
          - string
          - 'null'
    CreateProject:
      type: object
      required:
      - name
      - repository_url
      properties:
        default_branch:
          type:
          - string
          - 'null'
        name:
          type: string
        repository_url:
          type: string
    CreatePullRequest:
      type: object
      required:
      - repository_name
      - title
      - source_branch
      - target_branch
      properties:
        description:
          type:
          - string
          - 'null'
        repository_name:
          type: string
        source_branch:
          type: string
        target_branch:
          type: string
        title:
          type: string
    CreateSecret:
      type: object
      required:
      - key
      - value
      properties:
        key:
          type: string
        value:
          type: string
    CreateToken:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        user_id:
          type:
          - string
          - 'null'
          format: uuid
    CreateWebhook:
      type: object
      required:
      - url
      properties:
        enabled:
          type:
          - boolean
          - 'null'
        events:
          type: array
          items:
            type: string
        url:
          type: string
    CreatedToken:
      allOf:
      - $ref: '#/components/schemas/ApiToken'
      - type: object
        required:
        - value
        properties:
          value:
            type: string
    Deployment:
      type: object
      required:
      - id
      - environment_id
      - git_ref
      - status
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        environment_id:
          type: string
          format: uuid
        git_ref:
          type: string
        id:
          type: string
          format: uuid
        pipeline_id:
          type:
          - string
          - 'null'
          format: uuid
        status:
          type: string
    DiffFile:
      type: object
      required:
      - path
      - status
      - additions
      - deletions
      properties:
        additions:
          type: integer
          format: int32
          minimum: 0
        deletions:
          type: integer
          format: int32
          minimum: 0
        path:
          type: string
        status:
          type: string
    DiffResult:
      type: object
      required:
      - from
      - to
      - merge_base
      - files
      - patch
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/DiffFile'
        from:
          type: string
        merge_base:
          type: string
        patch:
          type: string
        to:
          type: string
    Environment:
      type: object
      required:
      - id
      - project_id
      - name
      - status
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
        project_id:
          type: string
          format: uuid
        status:
          type: string
        url:
          type:
          - string
          - 'null'
    GitPushEvent:
      type: object
      required:
      - repository
      - ref_name
      properties:
        ref_name:
          type: string
        repository:
          type: string
    Job:
      type: object
      required:
      - id
      - stage_id
      - name
      - image
      - command
      - position
      - status
      properties:
        command:
          type: string
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
          format: uuid
        image:
          type: string
        name:
          type: string
        position:
          type: integer
          format: int32
        stage_id:
          type: string
          format: uuid
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type: string
    JobLog:
      type: object
      required:
      - id
      - job_id
      - sequence
      - message
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        job_id:
          type: string
          format: uuid
        message:
          type: string
        sequence:
          type: integer
          format: int32
    JobStatus:
      type: string
      enum:
      - queued
      - running
      - success
      - failed
      - canceled
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        password:
          type: string
        refresh_token:
          type: string
          description: 'Only for /auth/refresh: the previously issued refresh token.'
        username:
          type: string
    Notification:
      type: object
      required:
      - id
      - project_id
      - channel
      - target
      - enabled
      - created_at
      properties:
        channel:
          type: string
        created_at:
          type: string
          format: date-time
        enabled:
          type: boolean
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        target:
          type: string
    NotificationInput:
      type: object
      required:
      - channel
      - target
      properties:
        channel:
          type: string
        enabled:
          type:
          - boolean
          - 'null'
        target:
          type: string
    Pipeline:
      type: object
      required:
      - id
      - project_id
      - git_ref
      - status
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        git_ref:
          type: string
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type: string
    PipelineDetail:
      type: object
      required:
      - pipeline
      - stages
      properties:
        pipeline:
          $ref: '#/components/schemas/Pipeline'
        stages:
          type: array
          items:
            $ref: '#/components/schemas/StageDetail'
    PrAction:
      type: object
      required:
      - action
      properties:
        action:
          type: string
    Project:
      type: object
      required:
      - id
      - name
      - repository_url
      - default_branch
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        default_branch:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        repository_url:
          type: string
    PullRequest:
      type: object
      required:
      - id
      - repository_name
      - number
      - title
      - description
      - source_branch
      - target_branch
      - status
      - created_by
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        description:
          type: string
        id:
          type: string
          format: uuid
        merge_commit_sha:
          type:
          - string
          - 'null'
        merged_at:
          type:
          - string
          - 'null'
          format: date-time
        number:
          type: integer
          format: int32
        repository_name:
          type: string
        source_branch:
          type: string
        status:
          type: string
        target_branch:
          type: string
        title:
          type: string
        updated_at:
          type: string
          format: date-time
    RefInfo:
      type: object
      required:
      - name
      - sha
      - target
      properties:
        name:
          type: string
        sha:
          type: string
        target:
          type: string
    RegisterRunner:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        tags:
          type: array
          items:
            type: string
    Report:
      type: object
      required:
      - total_pipelines
      - successful_pipelines
      - failed_pipelines
      - success_rate
      - average_duration_seconds
      properties:
        average_duration_seconds:
          type: number
          format: double
        failed_pipelines:
          type: integer
          format: int64
        success_rate:
          type: number
          format: double
        successful_pipelines:
          type: integer
          format: int64
        total_pipelines:
          type: integer
          format: int64
    Repository:
      type: object
      required:
      - id
      - name
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
    Runner:
      type: object
      required:
      - id
      - name
      - tags
      - status
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
        name:
          type: string
        status:
          type: string
        tags:
          type: array
          items:
            type: string
    RunnerHeartbeat:
      type: object
      properties:
        status:
          type:
          - string
          - 'null'
    Schedule:
      type: object
      required:
      - id
      - project_id
      - cron
      - git_ref
      - enabled
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        cron:
          type: string
        enabled:
          type: boolean
        git_ref:
          type: string
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
    ScheduleInput:
      type: object
      required:
      - cron
      - git_ref
      properties:
        cron:
          type: string
        enabled:
          type:
          - boolean
          - 'null'
        git_ref:
          type: string
    SecretMetadata:
      type: object
      required:
      - id
      - project_id
      - key
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        key:
          type: string
        project_id:
          type: string
          format: uuid
        updated_at:
          type: string
          format: date-time
    Stage:
      type: object
      required:
      - id
      - pipeline_id
      - name
      - position
      - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        pipeline_id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
        status:
          type: string
    StageDetail:
      allOf:
      - $ref: '#/components/schemas/Stage'
      - type: object
        required:
        - jobs
        properties:
          jobs:
            type: array
            items:
              $ref: '#/components/schemas/Job'
    TokenPair:
      type: object
      required:
      - access_token
      - expires_at
      - refresh_token
      properties:
        access_token:
          type: string
        expires_at:
          type: integer
          format: int64
