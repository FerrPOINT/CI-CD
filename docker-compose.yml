services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${CICD_DATABASE_USER:-cicd}
      POSTGRES_PASSWORD: ${CICD_DATABASE_PASSWORD:-cicd_local_only}
      POSTGRES_DB: ${CICD_DATABASE_NAME:-cicd}
    ports:
      # Local development only: database is never exposed beyond this host.
      - "127.0.0.1:${CICD_DATABASE_PORT:-22543}:5432"
    volumes:
      - cicd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CICD_DATABASE_USER:-cicd} -d ${CICD_DATABASE_NAME:-cicd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      CICD_DATABASE_URL: postgresql://${CICD_DATABASE_USER:-cicd}:${CICD_DATABASE_PASSWORD:-cicd_local_only}@postgres:5432/${CICD_DATABASE_NAME:-cicd}
      CICD_BIND: 0.0.0.0:22801
      CICD_MIGRATIONS_DIR: /app/migrations
      CICD_GIT_ROOT: /var/lib/forge/git
      CICD_GIT_TOKEN: ${CICD_GIT_TOKEN:-}
      CICD_GIT_INTERNAL_TOKEN: ${CICD_GIT_INTERNAL_TOKEN:-}
      CICD_SECRETS_KEY: ${CICD_SECRETS_KEY:-}
      CICD_ARTIFACTS_DIR: /var/lib/forge/artifacts
      CICD_ARTIFACT_RETENTION_DAYS: ${CICD_ARTIFACT_RETENTION_DAYS:-30}
      # Local compose runs the embedded runner inside the backend container.
      # Set docker only when a Docker executor/socket setup is wired deliberately.
      CICD_EMBEDDED_RUNNER_ENABLED: ${CICD_EMBEDDED_RUNNER_ENABLED:-true}
      CICD_RUNNER_MODE: ${CICD_RUNNER_MODE:-host}
      CICD_RUNNER_KEEP_WORKSPACE: ${CICD_RUNNER_KEEP_WORKSPACE:-false}
      CICD_RUNNER_QUEUE_TIMEOUT_SECONDS: ${CICD_RUNNER_QUEUE_TIMEOUT_SECONDS:-86400}
      CICD_RUNNER_REGISTRATION_TOKEN: ${CICD_RUNNER_REGISTRATION_TOKEN:-}
      CICD_AUTH_SECRET: ${CICD_AUTH_SECRET:-}
      CICD_AUTH_COOKIE_SECURE: ${CICD_AUTH_COOKIE_SECURE:-false}
      CICD_CORS_ALLOWED_ORIGINS: ${CICD_CORS_ALLOWED_ORIGINS:-}
      RUST_LOG: info
    ports:
      - "${CICD_API_PORT:-22801}:22801"
    volumes:
      - cicd_git_repos:/var/lib/forge/git
      - cicd_artifacts:/var/lib/forge/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:22801/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  runner:
    profiles: ["external-runner"]
    build:
      context: ./backend
    command: ["forge-runner"]
    environment:
      CICD_API_URL: http://backend:22801
      CICD_RUNNER_CREDENTIAL: ${CICD_RUNNER_CREDENTIAL:-}
      CICD_RUNNER_REGISTRATION_TOKEN: ${CICD_RUNNER_REGISTRATION_TOKEN:-}
      CICD_RUNNER_NAME: ${CICD_RUNNER_NAME:-forge-runner}
      CICD_RUNNER_TAGS: ${CICD_RUNNER_TAGS:-linux,host}
      CICD_RUNNER_TOTAL_SLOTS: ${CICD_RUNNER_TOTAL_SLOTS:-1}
      CICD_RUNNER_POLL_INTERVAL_SECONDS: ${CICD_RUNNER_POLL_INTERVAL_SECONDS:-5}
      CICD_RUNNER_NO_CHECKOUT: ${CICD_RUNNER_NO_CHECKOUT:-false}
      CICD_RUNNER_WORK_DIR: ${CICD_RUNNER_WORK_DIR:-/var/lib/forge/runner-work}
      CICD_RUNNER_KEEP_WORKSPACE: ${CICD_RUNNER_KEEP_WORKSPACE:-false}
      RUST_LOG: info
    volumes:
      - cicd_runner_work:/var/lib/forge/runner-work
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: CI-CD/frontend/Dockerfile
    ports:
      - "${CICD_WEB_PORT:-22802}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  cicd_postgres_data:
  cicd_git_repos:
  cicd_artifacts:
  cicd_runner_work:
